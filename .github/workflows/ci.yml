name: validar HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


    jobs:
       validar:
       name: maquina virtual
       runs-on: ubuntu-latest

       steps:
          - name: clonar el codigo
            uses: actions/checkout@v4

          - name: instalar node
            uses: actions/setup-node@v3
            with:
              node-version: '22'
           
          - name: instalar dependencias
            run: |
             echo "inicio"
             npx html-validate "**/*.html"
             echo
            